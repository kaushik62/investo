name: investo

services:

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    image: kaushik62/investo:backend
    ports:
      - "5000:5000"
    env_file:
      - path: .env
        required: false
    depends_on:
      - mongodb
      - redis

  frontend:
    build: ./frontend
    image: kaushik62/investo:frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  mongo-data: