version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: Investo-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: Investo
    networks:
      - Investo-net

  backend:
    build: ./backend
    container_name: Investo-backend
    ports:
      - "5000:5000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/Investo
      - JWT_SECRET=your_jwt_secret_here
      - PORT=5000
      - FRONTEND_URL=http://localhost:3000
      - NODE_ENV=development
    depends_on:
      - mongodb
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - Investo-net
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: Investo-frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:5000/api
      - REACT_APP_SOCKET_URL=http://localhost:5000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - Investo-net

volumes:
  mongo_data:

networks:
  Investo-net:
    driver: bridge
